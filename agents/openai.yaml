interface:
  display_name: "羊皮紙剪紙文章精選圖與文內圖"
  short_description: "一個 Prompt 自動完成文章分析、精選圖、文內圖、QA 與插入"
  default_prompt: "Use $editorial-documentary-illustrations 讀取我提供的文章網址、檔案或全文，自動生成一張標題導向的精選圖片與最合適數量的文內圖。請依文章長度、上下文、理解增益與非重複性決定數量和插入位置；使用高品質圖片模型實際生圖，保持精簡圖片 Prompt，完成文字、裁切、遮擋與跨圖一致性 QA，並把圖片插入原文章。"
policy:
  allow_implicit_invocation: true

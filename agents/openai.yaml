interface:
  display_name: "VOX 剪紙文章圖解"
  short_description: "依文章長度與內容，自動產生最佳數量、位置與解釋文字的剪紙文內圖"
  default_prompt: "Use $editorial-documentary-illustrations 分析文章長度、章節與視覺錨點，自動決定最佳圖片數量與插入位置。每張成品使用 VOX-inspired 羊皮紙剪紙場景，並整合一個核心結論、一行補充說明與 2–4 個短解釋卡；圖片與文字共同解釋上下文，不生成泛用 AI 圖，也不使用散亂 callout。"
policy:
  allow_implicit_invocation: true
